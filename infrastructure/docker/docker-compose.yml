services:

  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: postgres:16
    container_name: priceflow-postgres

    environment:
      POSTGRES_USER: priceflow
      POSTGRES_PASSWORD: priceflow
      POSTGRES_DB: priceflow_cost_request

    ports:
      - "5432:5432"

    volumes:
      - priceflow-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U priceflow -d priceflow_cost_request"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - priceflow-network

    restart: unless-stopped


  # =========================================================
  # Apache Kafka - KRaft Mode
  # =========================================================
  kafka:
    image: apache/kafka:4.1.1
    container_name: priceflow-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://priceflow-kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@priceflow-kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - priceflow-kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - priceflow-network

    restart: unless-stopped


  # =========================================================
  # Apicurio Schema Registry
  # =========================================================
  schema-registry:
    image: apicurio/apicurio-registry:3.1.6
    container_name: priceflow-schema-registry

    ports:
      - "8085:8080"

    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql

      APICURIO_DATASOURCE_URL: jdbc:postgresql://priceflow-postgres:5432/priceflow_registry
      APICURIO_DATASOURCE_USERNAME: priceflow
      APICURIO_DATASOURCE_PASSWORD: priceflow

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - priceflow-network

    restart: unless-stopped


  # =========================================================
  # Kafbat Kafka UI
  # =========================================================
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: priceflow-kafka-ui

    ports:
      - "8086:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: priceflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: priceflow-kafka:29092

      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://priceflow-schema-registry:8080/apis/ccompat/v7

    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started

    networks:
      - priceflow-network

    restart: unless-stopped


# =========================================================
# Persistent Volumes
# =========================================================
volumes:

  priceflow-postgres-data:
    name: priceflow-postgres-data

  priceflow-kafka-data:
    name: priceflow-kafka-data


# =========================================================
# Network
# =========================================================
networks:

  priceflow-network:
    name: priceflow-network