name: Priceflow CI

on:
  push:
    branches:
      - main
      - feature/Priceflow
  pull_request:
    branches:
      - main

jobs:

  cost-request-service:
    name: Build Cost Request Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/cost-request-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean verify


  pricing-service:
    name: Build Pricing Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/pricing-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean verify


  notification-service:
    name: Build Notification Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean verify