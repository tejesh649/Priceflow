name: Priceflow CI

on:
  push:
    branches:
      - main
      - feature/Priceflow
  pull_request:
    branches:
      - main

jobs:

  cost-request-service:
    name: Build Cost Request Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/cost-request-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean verify


  pricing-service:
    name: Build Pricing Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/pricing-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean verify


  notification-service:
    name: Build Notification Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean verify
  docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - cost-request-service
      - pricing-service
      - notification-service

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Cost Request Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/cost-request-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/priceflow-cost-request-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/priceflow-cost-request-service:latest

      - name: Build and push Pricing Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/pricing-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/priceflow-pricing-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/priceflow-pricing-service:latest

      - name: Build and push Notification Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/priceflow-notification-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/priceflow-notification-service:latest